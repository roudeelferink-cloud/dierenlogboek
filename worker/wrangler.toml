# Cloudflare Worker: proxy voor fotoherkenning naar de Anthropic-API.
# Deploy:   npx wrangler deploy
# Secret:   npx wrangler secret put ANTHROPIC_API_KEY
name = "dierenlogboek-herkenning"
main = "src/index.js"
compatibility_date = "2026-07-01"

[vars]
# Komma-gescheiden lijst van toegestane origins (CORS).
# localhost:5173 staat erbij voor lokaal testen met `npm run dev`.
ALLOWED_ORIGINS = "https://roudeelferink-cloud.github.io,http://localhost:5173"
